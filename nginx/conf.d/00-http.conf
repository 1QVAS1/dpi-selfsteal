# Общие настройки уровня http (подключаются из /etc/nginx/conf.d/*.conf)

server_tokens off;
charset utf-8;
charset_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;


# --- сжатие ---
gzip on;
gzip_static on;          # если рядом лежит file.gz — отдаётся он
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

# --- кэш по типу ответа ---
map $uri $site_cache {
    default                                  "public, max-age=300, must-revalidate";
    ~*\.html$                                "public, max-age=300, must-revalidate";
    ~*/data/.*\.json$                        "public, max-age=300, must-revalidate";
    ~*\.woff2$                               "public, max-age=31536000, immutable";
    ~*\.(css|js|svg|png|jpe?g|webp|avif|ico)$ "public, max-age=2592000";
}

# --- TLS: общие параметры ---
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
