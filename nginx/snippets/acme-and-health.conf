# Порт 80: ACME-челлендж Let's Encrypt и проверка здоровья для healthcheck
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

location = /healthz {
    access_log off;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    default_type text/plain;
    return 200 "ok\n";
}
